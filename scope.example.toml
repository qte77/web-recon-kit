# Example assessment-scope config. Copy to scope.toml and fill in your target.
# API keys are read from the ENVIRONMENT (never store secrets here) — scope.toml
# itself is git-ignored once you copy it, since it becomes target-specific.
# Select a different file per run with RECON_SCOPE=/path/to/scope.toml (default: scope.toml).

base_url = "https://TARGET.example.com"

# Identities the runners can act as. `env` names the env var holding the bearer
# token. An identity with an unset env var is simply skipped (runners degrade
# gracefully). At minimum you need `owner`; `tenant_b` enables BOLA (cross-tenant
# IDOR) and `lowrole` enables BFLA (function-level authz) checks.
[identities.owner]
env = "RECON_API_KEY"        # primary/workspace-A owner token
role = "owner"
workspace = "A"

# [identities.tenant_b]
# env = "RECON_API_KEY_B"    # 2nd workspace owner — required for BOLA
# role = "owner"
# workspace = "B"

# [identities.lowrole]
# env = "RECON_API_KEY_C"    # low-role member of workspace A — required for BFLA
# role = "member"
# workspace = "A"

[rate]
max_concurrency = 8           # bounded worker-pool size for the async client
per_host_delay_ms = 300       # polite per-host spacing; keeps us far from any DoS threshold

[safety]
# Runners only ever send these methods. Mutating verbs must never be added here.
methods = ["GET", "OPTIONS"]

[recon]
# Routes r1_recon renders + gate-classifies (browser tier). Defaults to ["/"]
# if omitted.
routes = ["/", "/login"]
# Path prefix r2_cron_auth treats as "cron" endpoints. Defaults to "/api/cron/"
# if omitted.
cron_prefix = "/api/cron/"

[authmatrix]
# Endpoints that are public by design — an unauthenticated 200 here is expected,
# not a finding, for r2_authmatrix. Defaults to [] (nothing whitelisted).
public_ok = []

[bfla]
# Path prefixes r3_rbac_bfla treats as admin/RBAC surface. Defaults to
# ["/api/admin/"] if omitted.
admin_prefixes = ["/api/admin/"]

[inventory]
# Literal path prefixes the bundle miner harvests from JS. Keep the trailing
# slash so "/claim" doesn't match "/claimant". Defaults to ["/api/"] if omitted.
path_prefixes = ["/api/"]
# Known paths appended to the inventory (source "seed") when mining misses them —
# both modes (browser and --no-browser). Optional.
# seed_paths = ["/api/health"]

[posture]
# Passive host posture (runners/r0_posture.py). Every key is optional.
# domains: default = base_url host minus a leading "www."; list subdomains explicitly.
# domains = ["example.test"]
# DoH JSON resolvers, tried in order (next one on error/5xx/429). They see the names.
# doh_urls = ["https://cloudflare-dns.com/dns-query", "https://dns.google/resolve"]
# "send" (default) = exactly 1 SPF + DMARC >= dmarc_min_policy;
# "none" = SPF "v=spf1 -all", DMARC p=reject, null MX.
mail_profile = "send"
dmarc_min_policy = "quarantine"   # none | quarantine | reject
require_caa = true
require_dnssec = false            # true = DS present + resolver-validated (AD)
hsts_min_max_age = 15552000       # seconds (180 days)
# caa_issuers = ["letsencrypt.org"]   # set to flag any other issuer
# caa_extra_issuers = []              # CDN-added issuers to accept, not flag

# [output]
# Where results/ and inventory/ are written. Defaults to this scope file's own
# directory (so targets/<name>/scope.toml -> targets/<name>/{results,inventory}/).
# A relative dir resolves against this file's directory; absolute is used as-is.
# dir = "out/acme"

# [bola]
# Collectors r3_bola uses to harvest resource IDs (as `owner`) and then probe
# them (as `tenant_b`) for cross-tenant leaks. Each collector needs:
#   kind            - short label for this resource type
#   list_path       - GET endpoint that lists the collection
#   collection_key  - key in the JSON body holding the list of items; may be
#                     dotted for a nested body, e.g. "data.result.items"
#   probe_template  - by-id GET path, with "{id}" as the placeholder
#   id_field        - (optional) item key holding the id; defaults to "id"
# [[bola.collectors]]
# kind = "widget"
# list_path = "/api/widgets"
# collection_key = "widgets"
# probe_template = "/api/widgets/{id}"
# id_field = "id"
